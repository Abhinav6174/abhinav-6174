<div class="header1" #header>
  <div class="tabs1">
    <div class="tabs1">
      <img class="tab1 vscode-icon" src="assets/vscode.png" />
      <div class="tab1">File</div>
      <div class="tab1">Edit</div>
      <div class="tab1">Selection</div>
      <div class="tab1">View</div>
      <div class="tab1">Go</div>
      <div class="tab1">Run</div>
      <div class="tab1">Terminal</div>
      <div class="tab1">Help</div>
    </div>
    <span class="arrow-box">
      <!-- Back Arrow -->
      <svg class="header-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" (click)="previous()" style="margin-right: 8px; margin-left: 18px; cursor: pointer;">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <!-- Forward Arrow -->
      <svg class="header-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" (click)="next()" style="cursor: pointer;">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </span>
    <span class="search-box">
      <!-- Search Icon -->
      <svg class="header-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 5px; width: 13px; height: 13px; vertical-align: middle;">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      Abhinav
    </span>
  </div>
  <div class="window-controls">
    <div class="theme-toggle" (click)="themeService.toggleTheme()" title="Toggle Dark/Light Theme">
      @if (themeService.isDarkTheme()) {
        <!-- Dynamic Sun SVG -->
        <svg class="theme-toggle-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      } @else {
        <!-- Dynamic Moon SVG -->
        <svg class="theme-toggle-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      }
    </div>
    <!-- Window Controls SVGs -->
    <svg class="window-controls-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" title="Minimise">
      <line x1="5" y1="12" x2="19" y2="12"></line>
    </svg>
    <svg class="window-controls-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" title="Maximise">
      <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
    </svg>
    <svg class="window-controls-icon-svg close-btn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" title="Close">
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
  </div>
</div>
